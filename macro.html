<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Master - Telemetria</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        
        .header h1 {
            color: #2d3748;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header .date {
            color: #718096;
            font-size: 1.1em;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            transition: transform 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
        
        .stat-card .label {
            color: #718096;
            font-size: 0.9em;
            margin-bottom: 5px;
        }
        
        .stat-card .value {
            font-size: 2em;
            font-weight: 700;
            color: #2d3748;
        }
        
        .stat-card.critical .value { color: #f56565; }
        .stat-card.warning .value { color: #ed8936; }
        .stat-card.ok .value { color: #48bb78; }
        
        .alerts-section {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        
        .alerts-section h2 {
            color: #2d3748;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .alert-item {
            background: #f7fafc;
            border-left: 4px solid #ed8936;
            padding: 15px 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }
        
        .alert-item:hover {
            background: #edf2f7;
            transform: translateX(5px);
        }
        
        .alert-item.critical { border-left-color: #f56565; }
        .alert-item.warning { border-left-color: #ed8936; }
        .alert-item.info { border-left-color: #4299e1; }
        
        .alert-content {
            flex: 1;
        }
        
        .alert-title {
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 5px;
        }
        
        .alert-description {
            color: #718096;
            font-size: 0.9em;
        }
        
        .alert-actions {
            display: flex;
            gap: 10px;
        }
        
        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9em;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }
        
        .btn-secondary:hover {
            background: #667eea;
            color: white;
        }
        
        .btn-danger {
            background: #f56565;
            color: white;
        }
        
        .add-alert-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 2em;
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.5);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .add-alert-btn:hover {
            transform: scale(1.1);
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal.active { display: flex; }
        
        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .modal-content h3 {
            margin-bottom: 20px;
            color: #2d3748;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #4a5568;
            font-weight: 600;
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 1em;
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        .form-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #a0aec0;
        }
        
        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        
        .dashboards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .dashboard-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .dashboard-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
        
        .dashboard-card h3 {
            color: #2d3748;
            margin-bottom: 10px;
        }
        
        .dashboard-card .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
        }
        
        .dashboard-card .status.ok {
            background: #c6f6d5;
            color: #22543d;
        }
        
        .dashboard-card .status.warning {
            background: #feebc8;
            color: #7c2d12;
        }
        
        .dashboard-card .status.critical {
            background: #fed7d7;
            color: #742a2a;
        }
        
        .filter-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .filter-tab {
            padding: 8px 20px;
            border-radius: 20px;
            border: 2px solid #e2e8f0;
            background: white;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .filter-tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Dashboard Master - Telemetria</h1>
            <div class="date" id="currentDate"></div>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card critical">
                <div class="label">Alertas Críticos</div>
                <div class="value" id="criticalCount">0</div>
            </div>
            <div class="stat-card warning">
                <div class="label">Avisos</div>
                <div class="value" id="warningCount">0</div>
            </div>
            <div class="stat-card ok">
                <div class="label">Informações</div>
                <div class="value" id="infoCount">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Total de Alertas</div>
                <div class="value" id="totalCount">0</div>
            </div>
        </div>
        
        <div class="alerts-section">
            <h2>🚨 Alertas e Anotações</h2>
            
            <div class="filter-tabs">
                <div class="filter-tab active" data-filter="all">Todos</div>
                <div class="filter-tab" data-filter="critical">Críticos</div>
                <div class="filter-tab" data-filter="warning">Avisos</div>
                <div class="filter-tab" data-filter="info">Informações</div>
            </div>
            
            <div id="alertsList">
                <div class="empty-state">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                    <h3>Nenhum alerta registrado</h3>
                    <p>Clique no botão + para adicionar uma nova anotação</p>
                </div>
            </div>
        </div>
        
        <div class="alerts-section">
            <h2>📁 Dashboards Detalhados</h2>
            <div class="dashboards-grid" id="dashboardsList"></div>
        </div>
    </div>
    
    <button class="add-alert-btn" onclick="openModal()">+</button>
    
    <div class="modal" id="alertModal">
        <div class="modal-content">
            <h3>➕ Nova Anotação/Alerta</h3>
            <form id="alertForm">
                <div class="form-group">
                    <label>Severidade</label>
                    <select id="severity" required>
                        <option value="info">Informação</option>
                        <option value="warning">Aviso</option>
                        <option value="critical">Crítico</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Dashboard Relacionado</label>
                    <select id="dashboard">
                        <option value="">Geral</option>
                        <option value="dashboard_1">Dashboard 1 - Hodômetro</option>
                        <option value="dashboard_2">Dashboard 2 - Viagens</option>
                        <option value="dashboard_3">Dashboard 3 - Distâncias</option>
                        <option value="dashboard_4">Dashboard 4 - Velocidades</option>
                        <option value="dashboard_5">Dashboard 5 - Direções</option>
                        <option value="dashboard_6">Dashboard 6 - Eventos</option>
                        <option value="dashboard_7">Dashboard 7 - GPRS</option>
                        <option value="dashboard_8">Dashboard 8 - Satélites</option>
                        <option value="dashboard_9">Dashboard 9 - Mapa</option>
                        <option value="dashboard_10">Dashboard 10 - Comparativo</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Título</label>
                    <input type="text" id="title" placeholder="Ex: Diferença hodômetro > 850km" required>
                </div>
                
                <div class="form-group">
                    <label>Descrição</label>
                    <textarea id="description" placeholder="Descreva o problema encontrado ou observação..." required></textarea>
                </div>
                
                <div class="form-group">
                    <label>Veículo/Equipamento (opcional)</label>
                    <input type="text" id="vehicle" placeholder="Ex: Veículo A123">
                </div>
                
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>
    
    <script>
        // Configuração inicial
        const DASHBOARDS = [
            { id: 'dashboard_1', name: 'Hodômetro', url: './dashboard_hodometro.html' },
            { id: 'dashboard_2', name: 'Viagens', url: './dashboard_viagens.html' },
            { id: 'dashboard_3', name: 'Distâncias', url: './dashboard_distancias.html' },
            { id: 'dashboard_4', name: 'Velocidades', url: './dashboard_velocidades.html' },
            { id: 'dashboard_5', name: 'Direções', url: './dashboard_direcoes.html' },
            { id: 'dashboard_6', name: 'Eventos', url: './dashboard_eventos.html' },
            { id: 'dashboard_7', name: 'GPRS', url: './dashboard_gprs.html' },
            { id: 'dashboard_8', name: 'Satélites', url: './dashboard_satelites.html' },
            { id: 'dashboard_9', name: 'Mapa', url: './dashboard_mapa.html' },
            { id: 'dashboard_10', name: 'Comparativo', url: './dashboard_comparativo.html' }
        ];
        
        let alerts = [];
        let currentFilter = 'all';
        
        // Inicialização
        document.addEventListener('DOMContentLoaded', function() {
            loadAlerts();
            renderDashboards();
            updateStats();
            updateDate();
            setupFilterTabs();
        });
        
        function updateDate() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('currentDate').textContent = now.toLocaleDateString('pt-BR', options);
        }
        
        function loadAlerts() {
            const stored = localStorage.getItem('telemetry_alerts');
            alerts = stored ? JSON.parse(stored) : [];
            renderAlerts();
        }
        
        function saveAlerts() {
            localStorage.setItem('telemetry_alerts', JSON.stringify(alerts));
        }
        
        function renderAlerts() {
            const container = document.getElementById('alertsList');
            const filtered = currentFilter === 'all' 
                ? alerts 
                : alerts.filter(a => a.severity === currentFilter);
            
            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                        </svg>
                        <h3>Nenhum alerta registrado</h3>
                        <p>Clique no botão + para adicionar uma nova anotação</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = filtered.map((alert, index) => `
                <div class="alert-item ${alert.severity}">
                    <div class="alert-content">
                        <div class="alert-title">
                            ${getSeverityIcon(alert.severity)} ${alert.title}
                            ${alert.vehicle ? `<span style="color: #a0aec0; font-weight: normal;"> - ${alert.vehicle}</span>` : ''}
                        </div>
                        <div class="alert-description">${alert.description}</div>
                        <div style="margin-top: 8px; font-size: 0.85em; color: #a0aec0;">
                            ${alert.dashboard ? getDashboardName(alert.dashboard) + ' • ' : ''}
                            ${new Date(alert.timestamp).toLocaleString('pt-BR')}
                        </div>
                    </div>
                    <div class="alert-actions">
                        ${alert.dashboard ? `<button class="btn btn-secondary" onclick="openDashboard('${alert.dashboard}')">Ver Dashboard</button>` : ''}
                        <button class="btn btn-danger" onclick="deleteAlert(${alert.id})">✕</button>
                    </div>
                </div>
            `).join('');
        }
        
        function getSeverityIcon(severity) {
            const icons = {
                critical: '🔴',
                warning: '⚠️',
                info: 'ℹ️'
            };
            return icons[severity] || 'ℹ️';
        }
        
        function getDashboardName(id) {
            const dashboard = DASHBOARDS.find(d => d.id === id);
            return dashboard ? dashboard.name : 'Dashboard';
        }
        
        function renderDashboards() {
            const container = document.getElementById('dashboardsList');
            container.innerHTML = DASHBOARDS.map(dash => {
                const alertsCount = alerts.filter(a => a.dashboard === dash.id).length;
                const criticalCount = alerts.filter(a => a.dashboard === dash.id && a.severity === 'critical').length;
                const status = criticalCount > 0 ? 'critical' : (alertsCount > 0 ? 'warning' : 'ok');
                
                return `
                    <div class="dashboard-card" onclick="openDashboard('${dash.id}')">
                        <h3>${dash.name}</h3>
                        <div style="margin-top: 10px;">
                            <span class="status ${status}">
                                ${status === 'ok' ? '✓ OK' : `${alertsCount} alerta(s)`}
                            </span>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function updateStats() {
            document.getElementById('criticalCount').textContent = alerts.filter(a => a.severity === 'critical').length;
            document.getElementById('warningCount').textContent = alerts.filter(a => a.severity === 'warning').length;
            document.getElementById('infoCount').textContent = alerts.filter(a => a.severity === 'info').length;
            document.getElementById('totalCount').textContent = alerts.length;
        }
        
        function setupFilterTabs() {
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.dataset.filter;
                    renderAlerts();
                });
            });
        }
        
        function openModal() {
            document.getElementById('alertModal').classList.add('active');
        }
        
        function closeModal() {
            document.getElementById('alertModal').classList.remove('active');
            document.getElementById('alertForm').reset();
        }
        
        document.getElementById('alertForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const newAlert = {
                id: Date.now(),
                severity: document.getElementById('severity').value,
                dashboard: document.getElementById('dashboard').value,
                title: document.getElementById('title').value,
                description: document.getElementById('description').value,
                vehicle: document.getElementById('vehicle').value,
                timestamp: new Date().toISOString()
            };
            
            alerts.unshift(newAlert);
            saveAlerts();
            renderAlerts();
            renderDashboards();
            updateStats();
            closeModal();
        });
        
        function deleteAlert(id) {
            if (confirm('Deseja realmente excluir este alerta?')) {
                alerts = alerts.filter(a => a.id !== id);
                saveAlerts();
                renderAlerts();
                renderDashboards();
                updateStats();
            }
        }
        
        function openDashboard(dashboardId) {
            const dashboard = DASHBOARDS.find(d => d.id === dashboardId);
            if (dashboard) {
                window.open(dashboard.url, '_blank');
            }
        }
        
        // Fechar modal clicando fora
        document.getElementById('alertModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
        
        // Fechar modal com ESC
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });
    </script>
</body>
</html>
