
<!DOCTYPE html>
<html>
<head>
    <title>Análise de Estabilidade de Satélites</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1"></script>
    <style>
    .categoria {
        margin-bottom: 40px;
    }
    .titulo-wrapper {
        text-align: center;
        margin-bottom: 20px;
    }
    .titulo-categoria {
        display: inline-block;
        font-size: 24px;
        font-weight: bold;
        padding: 10px 20px;
        border-radius: 20px;
        color: white;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
    }
    .filter-buttons button {
        padding: 6px 15px;
        border: none;
        border-radius: 15px;
        font-size: 12px;
        cursor: pointer;
        background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        color: white;
        font-weight: 500;
        transition: all 0.3s ease;
        margin: 2px;
    }
    .filter-buttons button:hover {
        transform: translateY(-1px);
        opacity: 0.9;
    }
    .filter-buttons button.active {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        font-weight: bold;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .filter-buttons {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 10px;
        flex-wrap: wrap;
    }
    .grafico-container {
        background: white;
        border-radius: 15px;
        padding: 20px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        margin-bottom: 20px;
    }
    .grafico-titulo-container {
        text-align: center;
        margin-bottom: 15px;
    }
    .grafico-titulo {
        font-size: 18px;
        font-weight: bold;
        color: #333;
    }
    .chart-wrapper {
        position: relative;
        height: 400px;
        width: 100%;
    }
    .zoom-controls {
        text-align: center;
        margin-top: 10px;
    }

    .zoom-instruction {
        text-align: center;
        font-size: 12px;
        color: #666;
        margin-top: 5px;
    }
    .diferenca-container {
        text-align: center;
        margin-top: 15px;
        padding: 10px;
        background-color: #f8f9fa;
        border-radius: 8px;
        font-size: 14px;
    }
    .diferenca-valor {
        font-weight: bold;
        color: green;
    }
    
    /* Modal para gráfico maximizado */
    .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0,0,0,0.8);
        backdrop-filter: blur(5px);
    }

    .modal-content {
        background: white;
        margin: 2% auto;
        padding: 30px;
        border-radius: 20px;
        width: 90%;
        max-width: 95vw;
        max-height: 90vh;
        overflow: auto;
    }

    .close-modal {
        color: #aaa;
        font-size: 28px;
        font-weight: bold;
        cursor: pointer;
        float: right;
    }

    .modal-chart-container {
        width: 100%;
        height: 70vh;
        position: relative;
        margin-top: 20px;
    }

    .modal-titulo {
        margin: 0 0 20px 0;
        font-size: 1.5em;
        color: #333;
        text-align: center;
    }
    </style>
</head>
<body>

<div class='categoria'>
    <div class='titulo-wrapper'>
        <div class='titulo-categoria'>Análise de Estabilidade de Satélites</div>
    </div>

    <div class='grafico-container'>
        <button class='btn-maximizar' onclick="maximizeChart('canvas_sat_line')">🔍 Maximizar</button>
        <div class='grafico-titulo-container'><h3 class='grafico-titulo'>Evolução Diária - Satélites Válidos e Inválidos</h3></div>

        <div class='filter-buttons'>
            <button id="btn-validos" onclick="filtrarSat('canvas_sat_line', 'Válidos')">Válidos</button>
            <button id="btn-invalidos" onclick="filtrarSat('canvas_sat_line', 'Inválidos')">Inválidos</button>
            <button id="btn-todos" onclick="filtrarSat('canvas_sat_line', 'Todos')">Todos</button>
        </div>

        <div class='chart-wrapper'>
            <canvas id='canvas_sat_line'></canvas>
        </div>
        <div class='zoom-controls'>
            <button onclick="resetZoom('canvas_sat_line')">Reset Zoom</button>
        </div>
        <div class='zoom-instruction'>Use o scroll do mouse para zoom ou duplo clique para resetar</div>
    </div>

    <script>
    (function() {
        const ctx = document.getElementById('canvas_sat_line').getContext('2d');
        const valRef = [100, 120];
        const valTeste = [110, 130];

        // Variável para controlar o filtro ativo
        let filtroAtivo = 'Válidos';
        
        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ["01/01", "02/01"],
                datasets: [{"label": "V\u00e1lidos Refer\u00eancia", "data": [100, 120], "borderColor": "#12094A", "backgroundColor": "#12094A", "tension": 0.3, "fill": false, "pointRadius": 4, "pointHoverRadius": 6, "pointBackgroundColor": "#12094A", "pointBorderColor": "#12094A", "pointBorderWidth": 1, "hidden": false}, {"label": "V\u00e1lidos Teste", "data": [110, 130], "borderColor": "#17becf", "backgroundColor": "#17becf", "tension": 0.3, "fill": false, "pointRadius": 4, "pointHoverRadius": 6, "pointBackgroundColor": "#17becf", "pointBorderColor": "#17becf", "pointBorderWidth": 1, "hidden": false}, {"label": "Inv\u00e1lidos Refer\u00eancia", "data": [10, 15], "borderColor": "red", "backgroundColor": "red", "tension": 0.3, "fill": false, "pointRadius": 4, "pointHoverRadius": 6, "pointBackgroundColor": "red", "pointBorderColor": "red", "pointBorderWidth": 1, "hidden": true}, {"label": "Inv\u00e1lidos Teste", "data": [12, 18], "borderColor": "darkorange", "backgroundColor": "darkorange", "tension": 0.3, "fill": false, "pointRadius": 4, "pointHoverRadius": 6, "pointBackgroundColor": "darkorange", "pointBorderColor": "darkorange", "pointBorderWidth": 1, "hidden": true}]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                plugins: {
                    legend: { 
                        display: true, 
                        position: 'top',
                        onClick: function(e, legendItem, legend) {
                            const chart = legend.chart;
                            const index = legendItem.datasetIndex;
                            const dataset = chart.data.datasets[index];
                            
                            // Se houver filtro ativo, verifica se o dataset clicado pertence ao filtro
                            if (filtroAtivo !== 'Todos') {
                                const pertenceAoFiltro = dataset.label.includes(filtroAtivo);
                                if (!pertenceAoFiltro) {
                                    return; // Não permite interação com datasets que não pertencem ao filtro
                                }
                            }
                            
                            // Alterna a visibilidade normalmente
                            dataset.hidden = !dataset.hidden;
                            chart.update();
                        }
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                const index = context.dataIndex;
                                const datasetIndex = context.datasetIndex;
                                const datasetLabel = context.dataset.label;
                                const value = context.raw;

                                if (datasetIndex === 0) {
                                    const testeVal = valTeste[index];
                                    if (value !== 0) {
                                        const diff = ((value - testeVal) / value) * 100;
                                        return `${datasetLabel}: ${value} (${diff.toFixed(1)}%)`;
                                    }
                                } else if (datasetIndex === 1) {
                                    const refVal = valRef[index];
                                    if (refVal !== 0) {
                                        const diff = ((value - refVal) / refVal) * 100;
                                        return `${datasetLabel}: ${value} (${diff.toFixed(1)}%)`;
                                    }
                                }
                                return `${datasetLabel}: ${value}`;
                            }
                        }
                    },
                    zoom: {
                        pan: { enabled: true, mode: 'xy' },
                        zoom: {
                            wheel: { enabled: true, speed: 0.1 },
                            pinch: { enabled: true },
                            drag: { enabled: true, backgroundColor: 'rgba(225,225,225,0.3)', borderWidth: 2 },
                            mode: 'xy'
                        }
                    }
                },
                scales: {
                    x: { type: 'category', title: { display: true, text: 'DIAS', font: { weight: 'bold', size: 14 }, color: '#222' } },
                    y: { title: { display: true, text: 'QUANTIDADE DE MENSAGENS', font: { weight: 'bold', size: 14 }, color: '#222' } }
                }
            }
        });

        window.charts = window.charts || {};
        window.charts['canvas_sat_line'] = chart;

        document.getElementById('canvas_sat_line').addEventListener('dblclick', function() {
            chart.resetZoom();
        });
    })();
    </script>

    <script>
    function filtrarSat(chartId, tipo) {
        const chart = window.charts[chartId];
        if (!chart) return;
        
        // Atualiza a variável de controle do filtro
        filtroAtivo = tipo;
        
        // Atualiza os botões
        document.getElementById('btn-validos').classList.remove('active');
        document.getElementById('btn-invalidos').classList.remove('active');
        document.getElementById('btn-todos').classList.remove('active');
        
        if (tipo === 'Válidos') {
            document.getElementById('btn-validos').classList.add('active');
            chart.data.datasets.forEach((dataset) => {
                dataset.hidden = !dataset.label.includes('Válidos');
            });
        } else if (tipo === 'Inválidos') {
            document.getElementById('btn-invalidos').classList.add('active');
            chart.data.datasets.forEach((dataset) => {
                dataset.hidden = !dataset.label.includes('Inválidos');
            });
        } else {
            document.getElementById('btn-todos').classList.add('active');
            chart.data.datasets.forEach((dataset) => {
                dataset.hidden = false; // Mostra todos os datasets
            });
        }
        
        chart.update();
    }

    // Ativa o botão Válidos por padrão
    document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('btn-validos').classList.add('active');
        // Garante que o filtro seja aplicado mesmo que o gráfico ainda não esteja totalmente carregado
        setTimeout(() => filtrarSat('canvas_sat_line', 'Válidos'), 100);
    });
    </script>

    <!-- Gráfico de Barras Horizontais com Porcentagem -->
    <div class='grafico-container' style="margin-top: 30px;">
        <button class='btn-maximizar' onclick="maximizeChart('canvas_sat_barras_validos')">🔍 Maximizar</button>
        <div class='grafico-titulo-container'><h3 class='grafico-titulo'>Total de Satélites Válidos (Referência x Teste)</h3></div>
        <div class='chart-wrapper'>
            <canvas id='canvas_sat_barras_validos'></canvas>
        </div>
        <div class='diferenca-container'>
            Diferença percentual: <span class='diferenca-valor'>9.09%</span>
            <br>
            <small>Teste em relação ao Referência</small>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
            const ctx = document.getElementById('canvas_sat_barras_validos').getContext('2d');
            
            const chart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Referência', 'Teste'],
                    datasets: [{
                        label: 'Quantidade',
                        data: [Number(220), Number(240)],
                        backgroundColor: ['#12094A', '#17becf'],
                        borderColor: ['#12094A', '#14a9b8'],
                        borderWidth: 1
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return context.dataset.label + ': ' + context.raw;
                                },
                                afterLabel: function(context) {
                                    const refValue = 220;
                                    const testValue = 240;
                                    const diff = ((testValue - refValue) / refValue * 100).toFixed(2);
                                    
                                    if (context.dataIndex === 0) {
                                        return 'Referência';
                                    } else {
                                        return 'Diferença: ' + diff + '%';
                                    }
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'QUANTIDADE DE MENSAGENS',
                                font: { weight: 'bold', size: 14 }
                            }
                        },
                        y: {
                            title: {
                                display: true,
                                text: 'CATEGORIA',
                                font: { weight: 'bold', size: 14 }
                            }
                        }
                    }
                }
            });
            
            window.charts = window.charts || {};
            window.charts['canvas_sat_barras_validos'] = chart;
        }, 500);
    });

    </script>
</div>

<!-- Modal para gráfico maximizado -->
<div id="maximizedModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <h2 class="modal-titulo" id="modalTitle">Maximized Chart</h2>
        <div class="modal-chart-container">
            <canvas id="maximizedChart"></canvas>
            <div class="zoom-controls">
                <button onclick="if (maximizedChartInstance) maximizedChartInstance.resetZoom();">Reset Zoom</button>
            </div>
        </div>
    </div>
</div>

<script>
// Função para maximizar gráficos
function maximizeChart(chartId) {
    const originalChart = window.charts[chartId];
    if (!originalChart) return console.error('Chart not found:', chartId);
    
    const modal = document.getElementById('maximizedModal');
    const modalTitle = document.getElementById('modalTitle');
    
    // Update modal title
    modalTitle.textContent = document.querySelector('#' + chartId).closest('.grafico-container').querySelector('.grafico-titulo').textContent;
    
    modal.style.display = 'block';
    
    const ctx = document.getElementById('maximizedChart').getContext('2d');
    if (window.maximizedChartInstance) window.maximizedChartInstance.destroy();
    
    // Create copy of data maintaining current visibility
    const chartData = JSON.parse(JSON.stringify(originalChart.data));
    
    window.maximizedChartInstance = new Chart(ctx, {
        type: originalChart.config.type, // Usa o tipo correto do gráfico original
        data: chartData,
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'nearest', intersect: false },
            plugins: {
                legend: { display: true, position: 'top' },
                zoom: {
                    pan: {
                        enabled: true,
                        mode: 'xy'
                    },
                    zoom: {
                        wheel: {
                            enabled: true,
                            speed: 0.1
                        },
                        pinch: {
                            enabled: true
                        },
                        drag: {
                            enabled: true,
                            backgroundColor: 'rgba(225,225,225,0.3)',
                            borderWidth: 2
                        },
                        mode: 'xy'
                    }
                }
            },
            scales: originalChart.options.scales
        }
    });

    // Sync dataset visibility
    originalChart.data.datasets.forEach((dataset, index) => {
        const isVisible = originalChart.getDatasetMeta(index).visible !== false;
        window.maximizedChartInstance.setDatasetVisibility(index, isVisible);
    });
    window.maximizedChartInstance.update();
    
    // Add double click event to reset zoom
    const maximizedCanvas = document.getElementById('maximizedChart');
    maximizedCanvas.addEventListener('dblclick', function() {
        if (window.maximizedChartInstance) {
            window.maximizedChartInstance.resetZoom();
        }
    });
}

// Function to close modal
function closeModal() {
    const modal = document.getElementById('maximizedModal');
    if (modal) {
        modal.style.display = 'none';
    }
    
    if (window.maximizedChartInstance) {
        window.maximizedChartInstance.destroy();
        window.maximizedChartInstance = null;
    }
}

// Initialize events when DOM is loaded
document.addEventListener('DOMContentLoaded', function() {
    // Close modal when clicking outside
    window.onclick = function(event) {
        const modal = document.getElementById('maximizedModal');
        if (event.target === modal) {
            closeModal();
        }
    };
    
    // Close modal with ESC key
    document.addEventListener('keydown', function(event) {
        if (event.key === 'Escape') {
            closeModal();
        }
    });
});
</script>

</body>
</html>
